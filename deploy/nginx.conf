# Logity — landing page (sitio estático)
# Copiar dentro de /etc/nginx/sites-available/ y enlazar a sites-enabled/,
# o pegar el bloque server en la configuración existente.
#
# Ajustar: server_name, root y las rutas de los certificados.

# Si el servidor no tiene IPv6, borrar las líneas "listen [::]..." de ambos
# bloques; si no, nginx no levanta.
server {
    listen 80;
    listen [::]:80;
    server_name logity.com www.logity.com;

    # Todo el tráfico por HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name logity.com www.logity.com;
    # En nginx >= 1.25.1 la forma moderna es quitar "http2" de las líneas
    # listen y agregar una línea aparte:  http2 on;

    ssl_certificate     /etc/letsencrypt/live/logity.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/logity.com/privkey.pem;

    root /var/www/logity;
    index index.html;

    # Comprimir solo lo que comprime bien.
    # El video, las fuentes woff2 y el JPG ya vienen comprimidos: no tocarlos.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    # text/html no se lista: nginx siempre lo comprime, y repetirlo da un warning.

    # HTML, CSS y JS cambian juntos en cada publicación y no llevan hash en el
    # nombre: se revalidan siempre, para que un cambio se vea al instante.
    location ~* \.(?:html|css|js)$ {
        add_header Cache-Control "no-cache";
    }

    # Los assets llevan contenido estable: caché larga
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Red de seguridad para instalaciones antiguas cuyo mime.types no conoce
    # woff2: si el mapa MIME ya lo trae, el mapa manda y esto no hace nada.
    # (No usar un bloque "types" aquí: reemplaza el mapa completo heredado y
    #  todo pasaría a servirse como application/octet-stream.)
    location ~* \.woff2$ {
        default_type font/woff2;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # El video se sirve por rangos (nginx lo hace por defecto);
    # es lo que permite que el hero empiece a reproducirse antes de descargarse entero.

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }
}
